<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d0c">
  <title>Offline — Nicholas Amissah</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    @font-face{font-family:Manrope;font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/manrope-latin.woff2') format('woff2')}
    @font-face{font-family:Sora;font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/sora-latin.woff2') format('woff2')}
    :root{color-scheme:dark;background:#0b0d0c;color:#f2f4f1;font-family:Manrope,system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}
    main{max-width:560px}
    p{color:#c5cbc6;font-size:17px;line-height:1.8}
    h1{font-family:Sora,Manrope,sans-serif;font-weight:500;font-size:clamp(2rem,7vw,3rem);line-height:1.2;letter-spacing:-.03em;text-wrap:balance}
    a{display:inline-block;margin-top:16px;padding:14px 20px;border-radius:5px;background:#b7f34a;color:#11160d;text-decoration:none;font-weight:600}
    a:focus-visible{outline:2px solid #b7f34a;outline-offset:5px}
    @media(prefers-color-scheme:light){:root{color-scheme:light;background:#fff;color:#19201b}p{color:#465149}a{background:#4f7908;color:white}}
  </style>
</head>
<body>
  <main>
    <p>Nicholas Amissah</p>
    <h1>This page isn’t available offline.</h1>
    <p>You can still explore the saved portfolio, projects and résumé. Reconnect to open external pages or send a message.</p>
    <a href="/">Open saved portfolio</a>
  </main>
</body>
</html>
