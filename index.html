      try {
        var preferredTheme = localStorage.getItem('portfolio-theme');
        var initialTheme = preferredTheme === 'light' || preferredTheme === 'dark' ? preferredTheme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

        document.documentElement.style.colorScheme = initialTheme;
